<link rel="preconnect" href="https://fonts.googleapis.com" />

<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@10..48,400..800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Caveat:wght@500;600;700&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="styles.css" />

<style>
  /* ----- Zone imprimable ----- */
  #print-root {
    position: fixed; left: -10000px; top: 0; width: 760px;
    background: #fff; color: #2a2620; padding: 36px;
    /* tokens forcés en clair pour le papier */
    --ink: #2a2620; --ink-2: #5b5346; --muted: #8c8270;
    --line: rgba(42,38,32,.14); --surface: #fff; --surface-2: #f4ecdd;
  }
  body.printing { background: #fff !important; }
  @media print {
    @page { margin: 14mm; }
    body.printing .app, body.printing .scrim, body.printing .twk-panel { display: none !important; }
    body.printing #print-root {
      position: static !important; left: 0 !important; width: 100% !important;
      padding: 0 !important;
    }
    body.printing { overflow: visible !important; height: auto !important; }
    html, body { height: auto !important; }
  }
</style>
</head>
<body>
<div id="root"></div>
